# Production stack: Postgres + website + Caddy (automatic HTTPS).
# Usage (from this folder):  docker compose up -d --build
name: berepacienty

x-db-url: &db_url postgresql://radar:${POSTGRES_PASSWORD:?set in .env}@db:5432/radar

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ../web
      args:
        SITE_URL: https://${DOMAIN:?set in .env}
    restart: unless-stopped
    environment:
      DATABASE_URL: *db_url
      SITE_URL: https://${DOMAIN}
      REPORT_SALT: ${REPORT_SALT:?set in .env}
      TRUST_PROXY: "1"
      ADS_PROVIDER: ${ADS_PROVIDER:-none}
      ANALYTICS_SRC: ${ANALYTICS_SRC:-}
      ANALYTICS_ID: ${ANALYTICS_ID:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      SEZNAM_WMT: ${SEZNAM_WMT:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-450}
      MAPY_API_KEY: ${MAPY_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy.d:/etc/caddy/caddy.d:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # One-off tool: docker compose run --rm importer <initdb|import ...|sponsor ...|crawl|alerts>
  importer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.importer
    profiles: ["tools"]
    environment:
      DATABASE_URL: *db_url
      SITE_URL: https://${DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      DIGEST_TO: ${DIGEST_TO:-}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-450}
    volumes:
      - ../data:/data:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
